# Cloudflare Workers config — see README.md for the full setup.
name = "puragroup-watcher"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Every 5 minutes. The scheduled handler checks every site in src/config.ts.
[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "puragroup-watcher"
# `wrangler d1 create puragroup-watcher` prints this id — paste it here.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
# Times on the dashboard and in alert emails.
TIMEZONE = "America/Toronto"
# Public URL of this dashboard (used for links in alert emails).
DASHBOARD_URL = ""
# Sender for alert emails, e.g. "Pura Watcher <alerts@puragroup.com>" (a Resend-verified domain).
ALERT_FROM = ""
# Comma-separated recipients added to EVERY site's alerts (per-site lists live in src/config.ts).
ALERT_EMAILS = ""

# Secrets (set with `wrangler secret put NAME`, never committed):
#   DASHBOARD_PASSWORD  password for the dashboard login
#   RESEND_API_KEY      sends alert emails through Resend
#   ALERT_WEBHOOK_URL   optional Slack/Discord incoming-webhook URL

[observability]
enabled = true
